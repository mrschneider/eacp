name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cryptography

      - name: Run test suite
        run: python tools/run_tests_fh.py

      - name: Cross-language conformance vectors
        run: |
          python conformance/generate.py
          python conformance/verify.py

      - name: Smoke test relay CLI
        run: python -m eacp.relay --help

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  rust-relay:
    name: Rust Relay (cargo test & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test
        run: cargo test --manifest-path crates/eacp-relay/Cargo.toml
      - name: Build release binary
        run: cargo build --release --manifest-path crates/eacp-relay/Cargo.toml

  interop:
    # The analysis's CI correction: building the Rust relay in a SEPARATE
    # job while the Python job skips the interop tests when the binary is
    # absent left Python<->Rust never actually exercised together. This job
    # builds Rust first, then runs the FULL Python suite with the binary
    # present, and FAILS if any test was skipped (no silent green).
    name: Python <-> Rust interop (no skips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust relay (release)
        run: cargo build --release --manifest-path crates/eacp-relay/Cargo.toml
      - name: Verify interop binary exists
        run: test -x crates/eacp-relay/target/release/eacp-relay
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cryptography
      - name: Run full suite with the Rust binary present
        run: |
          set -o pipefail
          python -m unittest discover tests -v 2>&1 | tee suite.log
          if grep -qi "skipped" suite.log; then
            echo "::error::Interop tests were SKIPPED with the Rust binary present"
            exit 1
          fi
      - name: Conformance vectors
        run: |
          python conformance/generate.py
          python conformance/verify.py

