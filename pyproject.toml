[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eacp"
version = "1.0.0"
description = "Enterprise Agentic Communication Protocol (EACP) Reference Implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
